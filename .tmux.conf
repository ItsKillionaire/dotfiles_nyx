# --- General Settings ---

# Force all new panes/windows to be normal, non-login shells
set-option -g default-command "$SHELL"

# Set the prefix to C-Space (Ctrl+Space) and unbind the default C-b
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Enable true color support for a modern look
set-option -sa terminal-overrides ",xterm*:Tc"

# Enable mouse support for scrolling, pane selection, etc.
set -g mouse on

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Automatically renumber windows when one is closed
set-option -g renumber-windows on


# --- Keybindings ---

# Switch panes using Prefix + h,j,k,l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config file with Prefix + r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Quickly view and select a pane with Prefix + q
bind q display-panes

# Split panes using | and - characters, and open in the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Seamless navigation between Neovim and tmux panes is handled by the
# 'vim-tmux-navigator' plugin (uses Ctrl + h,j,k,l).
# The bindings below are for when you're NOT in Neovim.

# Switch panes using Alt + Arrow keys (without prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Switch windows using Shift + Arrow keys (without prefix)
bind -n S-Left  previous-window
bind -n S-Right next-window

# Switch windows using Alt + H/L, Vim-style (without prefix)
bind -n M-H previous-window
bind -n M-L next-window


# --- Copy Mode (Vi Style) ---
# Note: The 'tmux-sensible' plugin already sets vi mode, but these
# specific bindings provide a more Vim-like experience.

# Enter copy mode with Prefix + [
# Use 'v' to start selection, 'C-v' for block selection, 'y' to yank
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel


# --- Theme ---
# Must be set before the plugins are loaded.

set -g @catppuccin_flavour 'mocha'


# --- Plugin Management (TPM) ---
# See https://github.com/tmux-plugins/tpm for instructions.
# Press `Prefix + I` to install new plugins.

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
# --- Resurrect & Continuum Configuration ---

# Restore pane contents (the text that was in the terminal)
set -g @resurrect-capture-pane-contents 'on'

# Enable auto-restore every time tmux starts
set -g @continuum-restore 'on'

# Set the auto-save interval to 15 minute
set -g @continuum-save-interval '5'

# --- List of Plugins ---
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

#Initialize TPM. This line MUST be at the very bottom of your config.

run '~/.tmux/plugins/tpm/tpm'
